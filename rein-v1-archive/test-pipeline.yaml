semaphore: 1
timeout: 120

blocks:
  # Agent 1 - 3 steps
  - name: agent-1-step-1
    command: "python3 mock-agent.py test-input.txt agent-1 1 output.txt"
    agent: agent-1

  - name: agent-1-step-2
    command: "python3 mock-agent.py output.txt agent-1 2 output.txt"
    agent: agent-1
    depends_on: [agent-1-step-1]

  - name: agent-1-step-3
    command: "python3 mock-agent.py output.txt agent-1 3 output.txt"
    agent: agent-1
    depends_on: [agent-1-step-2]

  # Agent 2 - 3 steps
  - name: agent-2-step-1
    command: "python3 mock-agent.py output.txt agent-2 1 output.txt"
    agent: agent-2
    depends_on: [agent-1-step-3]

  - name: agent-2-step-2
    command: "python3 mock-agent.py output.txt agent-2 2 output.txt"
    agent: agent-2
    depends_on: [agent-2-step-1]

  - name: agent-2-step-3
    command: "python3 mock-agent.py output.txt agent-2 3 output.txt"
    agent: agent-2
    depends_on: [agent-2-step-2]

  # Agent 3 - 2 steps
  - name: agent-3-step-1
    command: "python3 mock-agent.py output.txt agent-3 1 output.txt"
    agent: agent-3
    depends_on: [agent-2-step-3]

  - name: agent-3-step-2
    command: "python3 mock-agent.py output.txt agent-3 2 output.txt"
    agent: agent-3
    depends_on: [agent-3-step-1]

  # Final processor - 1 step
  - name: final-processor
    command: "python3 mock-agent.py output.txt final-processor 1 output.txt"
    agent: final-processor
    depends_on: [agent-3-step-2]
