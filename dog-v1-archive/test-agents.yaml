semaphore: 3
timeout: 300

blocks:
  # Deliberation Team - 3 phases
  - name: design-phase
    command: "python3 agent.py design-phase 30"
    agent: agent-creator

  - name: review-phase
    command: "python3 agent.py review-phase 25"
    agent: agent-critic
    depends_on: [design-phase]

  - name: finalize-phase
    command: "python3 agent.py finalize-phase 20"
    agent: agent-integrator
    depends_on: [review-phase]

  # Parallel development
  - name: implement-auth
    command: "python3 agent.py implement-auth 35"
    agent: dev-1

  - name: implement-api
    command: "python3 agent.py implement-api 35"
    agent: dev-2

  - name: implement-ui
    command: "python3 agent.py implement-ui 35"
    agent: dev-3

  # Integration test (waits for all development)
  - name: integration-test
    command: "python3 agent.py integration-test 15"
    agent: qa-lead
    depends_on: [implement-auth, implement-api, implement-ui]
