name: security-audit
team: team-security-audit
description: Comprehensive security audit with threat analysis and vulnerability assessment

blocks:
  - stage: threat-analysis
    agents: [security-expert-specialist]
    prompt: |
      Conduct a threat analysis for the given system/code.
      Identify:
      1. Key assets and data flows
      2. Potential threat actors
      3. Attack vectors and scenarios
      4. OWASP Top 10 applicability
      5. Industry-specific threats

      Rate each threat by severity and likelihood.
      Output as JSON with structure: {assets: [...], threats: [{threat: "...", severity: "...", likelihood: "..."}], priority_threats: [...]}
    parallel: false
    save_as: threat_analysis.json
    logic:
      post: logic/enhance-threats.py

  - stage: vulnerability-scan
    agents: [debugger-specialist]
    prompt: |
      Conduct a detailed vulnerability assessment.
      Focus on:
      1. Code vulnerabilities (injection, XSS, CSRF, etc.)
      2. Authentication/authorization weaknesses
      3. Data handling issues
      4. Dependency vulnerabilities
      5. Configuration security

      Document each finding with:
      - Description
      - Severity (Critical/High/Medium/Low)
      - Impact assessment
      - Reproduction steps
      - Remediation suggestion

      Output as JSON with structure: {vulnerabilities: [{issue: "...", severity: "...", impact: "...", fix: "..."}], critical_count: X, high_count: Y}
    parallel: true
    save_as: vulnerability_scan.json
    logic:
      validate: logic/validate-vulnerabilities.py

  - stage: architecture-security
    agents: [architect-specialist]
    prompt: |
      Assess security from architecture perspective.
      Evaluate:
      1. Security architecture design
      2. Defense-in-depth implementation
      3. Trust boundaries and data flow security
      4. Encryption implementation
      5. Logging and monitoring for security

      Provide recommendations for security improvements.
      Output as JSON with structure: {architecture_security: "...", strengths: [...], weaknesses: [...], design_recommendations: [...]}
    parallel: true
    save_as: architecture_security.json

  - stage: compliance-check
    agents: [analyst-specialist]
    prompt: |
      Analyze compliance requirements and gaps.
      Consider:
      1. Relevant regulations (GDPR, HIPAA, PCI-DSS, etc.)
      2. Data privacy requirements
      3. Audit and logging requirements
      4. Incident response readiness
      5. Security policy alignment

      Output as JSON with structure: {compliance_frameworks: [...], gaps: [...], recommendations: [...]}
    parallel: true
    save_as: compliance_check.json

  - stage: final-audit-report
    agents: [integrator-specialist]
    prompt: |
      Create comprehensive audit report synthesizing all findings:

      Threat Analysis:
      {{ threat_analysis.json }}

      Vulnerability Assessment:
      {{ vulnerability_scan.json }}

      Architecture Security:
      {{ architecture_security.json }}

      Compliance Check:
      {{ compliance_check.json }}

      Produce final audit report with:
      1. Executive summary
      2. Overall security rating (1-10)
      3. Critical/High findings summary
      4. Risk assessment matrix
      5. Remediation roadmap (prioritized)
      6. Timeline for fixes
      7. Recommended ongoing security practices

      Output as JSON with structure: {security_rating: X/10, critical_issues: X, high_issues: Y, risk_level: "...", remediation_plan: [...], estimated_effort: "..."}
    depends_on: [threat_analysis, vulnerability_scan, architecture_security, compliance_check]
    save_as: audit_report.json
    logic:
      post: logic/generate-audit-summary.py
