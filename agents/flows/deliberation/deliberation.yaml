schema_version: "2.5.3"
name: deliberation
team: team-deliberation
description: Generic multi-round deliberation workflow for any topic. Input via task.input.topic
max_parallel: 3
readable_outputs: true

# USAGE:
# python3 dog.py --flow deliberation --input '{"topic": "Your question or topic here"}'
#
# The team will analyze the topic through 4 phases:
# Phase 1: Independent analysis by 3 specialists
# Phase 2: Cross-review (each reads others' work)
# Phase 3: Synthesis with all feedback
# Phase 4: Final consolidated recommendation

blocks:
  # PHASE 1: Initial independent analysis
  - name: analyst_1_initial
    phase: 1
    specialist: prompt-engineer-specialist
    prompt: |
      TOPIC FOR ANALYSIS:
      {{ task.input.topic }}

      You are the first analyst. Analyze this topic from your specialized perspective.
      Focus on:
      1. Key aspects and considerations
      2. Pros and cons
      3. Potential risks and opportunities
      4. Your initial recommendation

      Output JSON with:
      - perspective: str (your role/angle)
      - key_points: [str]
      - pros: [str]
      - cons: [str]
      - risks: [str]
      - opportunities: [str]
      - initial_recommendation: str
    depends_on: []
    parallel: true
    logic:
      pre: logic/run-specialist.py
      custom: true

  - name: analyst_2_initial
    phase: 1
    specialist: workflow-architect
    prompt: |
      TOPIC FOR ANALYSIS:
      {{ task.input.topic }}

      You are the second analyst. Analyze this topic from your specialized perspective.
      Focus on:
      1. Technical and architectural aspects
      2. Implementation considerations
      3. Scalability and maintainability
      4. Your initial recommendation

      Output JSON with:
      - perspective: str (your role/angle)
      - technical_analysis: str
      - implementation_considerations: [str]
      - scalability_factors: [str]
      - initial_recommendation: str
    depends_on: []
    parallel: true
    logic:
      pre: logic/run-specialist.py
      custom: true

  - name: analyst_3_initial
    phase: 1
    specialist: quality-assurance-specialist
    prompt: |
      TOPIC FOR ANALYSIS:
      {{ task.input.topic }}

      You are the third analyst. Analyze this topic from quality/reliability perspective.
      Focus on:
      1. Quality implications
      2. Reliability considerations
      3. Testing and validation aspects
      4. Your initial recommendation

      Output JSON with:
      - perspective: str (your role/angle)
      - quality_analysis: str
      - reliability_factors: [str]
      - validation_considerations: [str]
      - initial_recommendation: str
    depends_on: []
    parallel: true
    logic:
      pre: logic/run-specialist.py
      custom: true

  # PHASE 2: Cross-review
  - name: analyst_1_review
    phase: 2
    specialist: prompt-engineer-specialist
    prompt: |
      ORIGINAL TOPIC:
      {{ task.input.topic }}

      Review your colleagues' analyses:
      - Analyst 2: {{ analyst_2_initial.json }}
      - Analyst 3: {{ analyst_3_initial.json }}

      Provide feedback on their perspectives and note:
      1. Points you agree with
      2. Points you disagree with
      3. Additional considerations they missed
      4. How their input affects your view

      Output JSON with:
      - agreements: [str]
      - disagreements: [str]
      - missed_points: [str]
      - updated_view: str
    depends_on: ["analyst_2_initial", "analyst_3_initial"]
    parallel: true
    continue_if_failed: true
    logic:
      pre: logic/run-specialist.py
      custom: true

  - name: analyst_2_review
    phase: 2
    specialist: workflow-architect
    prompt: |
      ORIGINAL TOPIC:
      {{ task.input.topic }}

      Review your colleagues' analyses:
      - Analyst 1: {{ analyst_1_initial.json }}
      - Analyst 3: {{ analyst_3_initial.json }}

      Provide feedback on their perspectives and note:
      1. Points you agree with
      2. Points you disagree with
      3. Additional considerations they missed
      4. How their input affects your view

      Output JSON with:
      - agreements: [str]
      - disagreements: [str]
      - missed_points: [str]
      - updated_view: str
    depends_on: ["analyst_1_initial", "analyst_3_initial"]
    parallel: true
    continue_if_failed: true
    logic:
      pre: logic/run-specialist.py
      custom: true

  - name: analyst_3_review
    phase: 2
    specialist: quality-assurance-specialist
    prompt: |
      ORIGINAL TOPIC:
      {{ task.input.topic }}

      Review your colleagues' analyses:
      - Analyst 1: {{ analyst_1_initial.json }}
      - Analyst 2: {{ analyst_2_initial.json }}

      Provide feedback on their perspectives and note:
      1. Points you agree with
      2. Points you disagree with
      3. Additional considerations they missed
      4. How their input affects your view

      Output JSON with:
      - agreements: [str]
      - disagreements: [str]
      - missed_points: [str]
      - updated_view: str
    depends_on: ["analyst_1_initial", "analyst_2_initial"]
    parallel: true
    continue_if_failed: true
    logic:
      pre: logic/run-specialist.py
      custom: true

  # PHASE 3: Synthesis
  - name: analyst_1_synthesis
    phase: 3
    specialist: prompt-engineer-specialist
    prompt: |
      ORIGINAL TOPIC:
      {{ task.input.topic }}

      Synthesize all feedback into your final position:
      - Your review: {{ analyst_1_review.json }}
      - Analyst 2 review: {{ analyst_2_review.json }}
      - Analyst 3 review: {{ analyst_3_review.json }}

      Consider all perspectives and provide your final recommendation.

      Output JSON with:
      - final_position: str
      - key_insights: [str]
      - recommendation: str
      - confidence: float (0-1)
    depends_on: ["analyst_1_review", "analyst_2_review", "analyst_3_review"]
    parallel: true
    logic:
      pre: logic/run-specialist.py
      custom: true

  - name: analyst_2_synthesis
    phase: 3
    specialist: workflow-architect
    prompt: |
      ORIGINAL TOPIC:
      {{ task.input.topic }}

      Synthesize all feedback into your final position:
      - Your review: {{ analyst_2_review.json }}
      - Analyst 1 review: {{ analyst_1_review.json }}
      - Analyst 3 review: {{ analyst_3_review.json }}

      Consider all perspectives and provide your final recommendation.

      Output JSON with:
      - final_position: str
      - key_insights: [str]
      - recommendation: str
      - confidence: float (0-1)
    depends_on: ["analyst_1_review", "analyst_2_review", "analyst_3_review"]
    parallel: true
    logic:
      pre: logic/run-specialist.py
      custom: true

  - name: analyst_3_synthesis
    phase: 3
    specialist: quality-assurance-specialist
    prompt: |
      ORIGINAL TOPIC:
      {{ task.input.topic }}

      Synthesize all feedback into your final position:
      - Your review: {{ analyst_3_review.json }}
      - Analyst 1 review: {{ analyst_1_review.json }}
      - Analyst 2 review: {{ analyst_2_review.json }}

      Consider all perspectives and provide your final recommendation.

      Output JSON with:
      - final_position: str
      - key_insights: [str]
      - recommendation: str
      - confidence: float (0-1)
    depends_on: ["analyst_1_review", "analyst_2_review", "analyst_3_review"]
    parallel: true
    logic:
      pre: logic/run-specialist.py
      custom: true

  # PHASE 4: Final consolidation
  - name: final_recommendation
    phase: 4
    specialist: workflow-architect
    prompt: |
      ORIGINAL TOPIC:
      {{ task.input.topic }}

      Create the final consolidated recommendation based on all synthesis documents:
      - Analyst 1 final: {{ analyst_1_synthesis.json }}
      - Analyst 2 final: {{ analyst_2_synthesis.json }}
      - Analyst 3 final: {{ analyst_3_synthesis.json }}

      Consolidate into a clear, actionable recommendation.

      Output JSON with:
      - topic: str (the original topic)
      - final_recommendation: str (clear answer/decision)
      - reasoning: str (why this recommendation)
      - key_points: [str] (main supporting points)
      - dissenting_views: [str] (if any disagreements remain)
      - action_items: [str] (next steps if applicable)
      - confidence: float (team confidence 0-1)
    depends_on: ["analyst_1_synthesis", "analyst_2_synthesis", "analyst_3_synthesis"]
    parallel: false
    logic:
      pre: logic/run-specialist.py
      custom: true
