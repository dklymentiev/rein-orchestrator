schema_version: 2.6.0
name: api-auth-security-review
description: Security review of proposed Agent-to-Agent Authorization Protocol for Flint
team: team-security
max_parallel: 2
blocks:
- name: security_architect
  specialist: security-architect
  depends_on: []
  prompt: 'You are a Security Architect reviewing a proposed agent-to-agent authorization protocol BEFORE implementation.


    Review the following protocol design for the Flint AI Agent HTTP API. Analyze the architecture, cryptographic choices, trust model, and protocol flow. Identify design-level weaknesses.


    Focus on:

    1. Protocol design soundness - is the handshake flow secure?

    2. Trust model - what assumptions are made about agent identity?

    3. Token generation and management - cryptographic strength, entropy, storage

    4. Session management - lifecycle, revocation, scope

    5. Persistence model - risks of Always Allow tokens on disk

    6. Concurrency - race conditions in the approval flow

    7. Localhost trust boundary - is binding to 127.0.0.1 sufficient?

    8. Missing security features - what is the protocol NOT addressing?


    For each issue found, rate severity (Critical/High/Medium/Low) and provide a specific recommendation.


    Output format: structured JSON analysis with sections for each focus area, severity ratings, and an overall protocol security rating (Strong/Adequate/Weak/Broken).


    PROTOCOL DESIGN TO REVIEW:


    Agent-to-Agent Authorization Protocol for Flint


    PROBLEM: Flint agent runs an HTTP API on localhost:3000. External agents (Claude Code, other Flint instances) need to send messages via POST /message. Current auth: random token generated at startup,
    shown truncated in UI -- unusable.


    PROPOSED FLOW - Interactive Handshake:

    1. Connection Request: External agent sends POST /connect with {agent_name, agent_type, purpose, pid}

    2. Approval Prompt: Flint shows dialog in terminal UI with agent info. User can Allow, Deny, or Always Allow.

    3. User Decides: Allow returns session token (valid until restart). Deny returns 403. Always Allow persists token to disk.

    4. Subsequent Requests: External agent uses Authorization: Bearer <token>

    5. Token stored by caller so it does not need to re-auth every time.


    SECURITY CONSIDERATIONS:

    1. Agent identification - can agent_name be spoofed? Should we use something stronger?

    2. Token scope - should tokens be scoped to specific endpoints?

    3. Token lifetime - session-only vs persistent, revocation

    4. Localhost-only binding - is 127.0.0.1 sufficient isolation?

    5. Always allow persistence - where to store, how to revoke

    6. Race conditions - what if two agents connect simultaneously?

    7. Token transmission - returned in HTTP response body, secure enough on localhost?

    8. PID verification - can we verify the connecting process PID?


    FILES INVOLVED:

    - src/security/api-auth.js - current token generation + middleware

    - src/api/server.js - HTTP server, needs new /connect endpoint

    - src/components/App.js - UI, needs approval prompt overlay

    - src/security/index.js - initSecurity, token management


    CURRENT CODE (api-auth.js):

    generateApiToken() uses crypto.randomBytes(24).toString(''hex'')

    createAuthMiddleware(token) checks Bearer token in Authorization header.

    OPTIONS requests and GET /status bypass auth.

    Returns 401 for missing auth, 403 for invalid token.


    CURRENT CODE (server.js):

    POST /message parses body, extracts content and name, calls processMessage.

    No /connect endpoint exists yet.'
- name: red_teamer
  specialist: red-teamer
  depends_on: []
  prompt: 'You are a Red Team specialist. Your job is to find concrete attack vectors against a proposed agent-to-agent authorization protocol for Flint AI Agent.


    Think like an attacker. For each attack vector: describe the attack step by step, explain prerequisites, rate exploitability (Easy/Medium/Hard), rate impact (Critical/High/Medium/Low), suggest specific
    mitigation.


    Consider these attack categories:

    1. Token theft and replay attacks

    2. Agent identity spoofing (agent_name, PID)

    3. Race condition exploitation in the approval flow

    4. Persistent token file attacks (Always Allow tokens on disk)

    5. Localhost escape scenarios (port forwarding, SSH tunnels, container breakout)

    6. Denial of service against the approval mechanism

    7. Time-of-check-time-of-use (TOCTOU) attacks

    8. Privilege escalation through the API

    9. Social engineering via the approval prompt (misleading agent_name/purpose)

    10. Token brute-forcing or prediction


    Output format: JSON with numbered attack vectors and the fields above. End with top 3 most critical findings.


