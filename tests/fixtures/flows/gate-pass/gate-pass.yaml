schema_version: "3.3.0"
name: gate-pass
team: team-arithmetic
max_parallel: 3
description: "Gate that always passes on first try. Tests forward routing path."

blocks:
  - name: prepare
    phase: 1
    prompt: "prepare"
    logic:
      custom: "../../mock_scripts/pass.py"

  - name: gate
    phase: 2
    depends_on: [prepare]
    prompt: "gate"
    logic:
      custom: "../../mock_scripts/gate_pass.py"
    routing:
      revise: fix
      _default: finish
    max_runs: 3

  - name: fix
    phase: 3
    depends_on: [gate]
    prompt: "fix"
    logic:
      custom: "../../mock_scripts/pass.py"
    next: gate
    max_runs: 3

  - name: finish
    phase: 3
    depends_on: [gate]
    prompt: "finish"
    logic:
      custom: "../../mock_scripts/pass.py"
