schema_version: "3.3.0"
name: linear-3
team: team-arithmetic
max_parallel: 3
description: "Linear 3-block chain: A -> B -> C. No routing, no retries."

blocks:
  - name: step_a
    phase: 1
    prompt: "first step"
    logic:
      custom: "../../mock_scripts/pass.py"

  - name: step_b
    phase: 2
    depends_on: [step_a]
    prompt: "second step"
    logic:
      custom: "../../mock_scripts/pass.py"

  - name: step_c
    phase: 3
    depends_on: [step_b]
    prompt: "third step"
    logic:
      custom: "../../mock_scripts/pass.py"
